# Jednorázové zapnutí GitHub Pages.
#
# Pages se běžně zapínají ručně v Settings → Pages. Tenhle workflow udělá
# to samé přes API: publikování ze složky docs/ na větvi main a doménu
# z docs/CNAME. Jakmile je zapnuto, staví web GitHub sám při každém pushi
# a workflow už není potřeba – klidně ho smaž.
#
# Pozor: nasazení přes actions/deploy-pages tady nefunguje. Job s prostředím
# github-pages se nespustí, dokud Pages neexistují, takže by se zapínaly
# krokem, na který by nikdy nedošlo.
name: Zapnout Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  zapnout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publikování ze složky docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          zdroj='{"source":{"branch":"main","path":"/docs"}}'
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "Pages už existují, jen srovnám zdroj."
            echo "$zdroj" | gh api -X PUT "repos/$REPO/pages" --input -
          else
            echo "$zdroj" | gh api -X POST "repos/$REPO/pages" --input -
          fi

      - name: Doména z docs/CNAME
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          domena=$(tr -d '[:space:]' < docs/CNAME)
          printf '{"cname":"%s","source":{"branch":"main","path":"/docs"}}' "$domena" \
            | gh api -X PUT "repos/$REPO/pages" --input -

      - name: Jak to dopadlo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pages" --jq '{stav: .status, url: .html_url, domena: .cname, zdroj: .source}'
