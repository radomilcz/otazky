# Nastavení pro Pages CMS (pagescms.org) – webová administrace nad tímhle repem.
# Přihlásíš se GitHubem na app.pagescms.org, vybereš repozitář a píšeš do formulářů.
# CMS commitne soubor do src/otazky/, GitHub Actions z něj přesází web i A4.

content:
  - name: serie
    label: Série
    type: collection
    path: src/serie
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nazev, poradi]
      primary: nazev
      sort: [poradi, nazev]
      default:
        sort: poradi
        order: asc
    fields:
      - name: nazev
        label: Název série
        type: string
        required: true
      - name: poradi
        label: Pořadí
        type: number
        description: Podle něj jdou série za sebou na rozcestníku. Nejmenší číslo nahoře.
      - name: popis
        label: Popis
        type: text
        description: Nepovinná věta pod názvem série na rozcestníku.

  - name: dily
    label: Díly
    type: collection
    path: src/otazky
    format: yaml-frontmatter
    filename: "{primary}.md"        # název souboru je zároveň adresa stránky
    view:
      fields: [titul, serie, datum, koncept]
      primary: titul
      sort: [datum, titul]
      default:
        sort: datum
        order: desc
    fields:
      - name: titul
        label: Titul dílu
        type: string
        required: true
        description: Bez čísla – to se doplní zvlášť. Třeba „Buď otevřený“.
      - name: serie
        label: Série
        type: reference
        options:
          collection: serie
          value: "{primary}"
          label: "{primary}"
        description: Vyber ze seznamu sérií. Novou založíš v sekci Série.
      - name: dil
        label: Číslo dílu
        type: number
      - name: datum
        label: Datum
        type: date
        required: true
        description: Nejnovější díl, jehož datum není v budoucnu, sedí na kořeni domény.
      - name: citat
        label: Citát nad otázkami
        type: text
        description: Nepovinné. Když zůstane prázdný, použije se věta z manifestu.
      - name: zdroj
        label: Odkud citát je
        type: string
      - name: koncept
        label: Koncept
        type: boolean
        description: Zaškrtnuté = na web se díl nedostane.
      - name: bloky
        label: Bloky otázek
        type: object
        list: true
        collapsible:
          collapsed: true
          summary: "{nazev}"
        fields:
          - name: nazev
            label: Název bloku
            type: string
            required: true
            description: Malými písmeny, na stránce se vysází verzálkami – „postoj“.
          - name: otazky
            label: Otázky
            type: string
            list: true

settings:
  content:
    merge: true
